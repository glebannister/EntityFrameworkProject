networks:
  globalmarketapp:

services: 
  db:
    container_name: db
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - '8002:1433'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DasPassword228!!!
    networks:
      - globalmarketapp
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P DasPassword228!!! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 3
  api:
    container_name: api
    image: 'globalmarket:dev'
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '8080:8080'
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db
      - DB_NAME=BolshevikDB
      - DB_SA_PASSWORD=DasPassword228!!!
      - GM_ConnectionStrings__AppDbConnectionString=${ConnectionStrings__AppDbConnectionString}
      - GM_JwtSettings__Key=${JwtSettings__Key}
    networks:
      - globalmarketapp